[model]
  extends = "nvfp4-base"
  id      = "nvidia/Qwen2.5-VL-7B-Instruct-NVFP4"
  notes   = "Qwen2.5 VL 7B vision-language NVFP4. Requires trust_remote_code. --quantization omitted; vLLM auto-detects."

[serve]
