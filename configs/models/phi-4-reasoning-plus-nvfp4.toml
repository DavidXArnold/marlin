[model]
  extends = "nvfp4-base"
  id      = "nvidia/Phi-4-reasoning-plus-NVFP4"
  notes   = "Phi-4 reasoning+ 14B NVFP4. Reasoning model — consider max_model_len >= 131072 for long chains. --quantization omitted; vLLM auto-detects."

[serve]
  tool_call_parser  = "hermes"
  served_model_name = ["local", "gn100", "phi-4-reasoning"]
