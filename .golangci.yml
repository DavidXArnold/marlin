linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - typecheck
    - gofmt
    - goimports
    - misspell
    - noctx
    - bodyclose
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes: github.com/DavidXArnold/marlin

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
