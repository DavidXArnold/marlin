version: "2"

run:
  timeout: 5m

linters:
  enable:
  - errcheck
  - govet
  - staticcheck
  - ineffassign
  - misspell
  - noctx
  - bodyclose
  - unconvert
  - gocritic
  settings:
    gocritic:
      disabled-checks:
      # Bubble Tea's `switch msg := msg.(type)` in Update() and provider-type
      # dispatch are idiomatic as switches even with one case today.
      - singleCaseSwitch
  exclusions:
    rules:
    - path: _test\.go
      linters:
      - errcheck

formatters:
  enable:
  - gofmt
